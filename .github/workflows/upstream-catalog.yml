name: Refresh upstream translation inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: write
concurrency:
  group: upstream-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run catalog:refresh
      - run: npm run build && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-coverage-report
          path: |
            catalog/upstream.json
            catalog/coverage.json
            catalog/COVERAGE.md
      - name: Commit updated sources and coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog locales .millennium/Dist/index.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official catalog sources and translation coverage'
            git push
          fi
